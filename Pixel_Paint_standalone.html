<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Paint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #141414;
  --box: #141414;
  --box-on: #232323;
  --line: #3a3a3a;
  --line-on: #f2f2f2;
  --text: #dcdcdc;
  --muted: #8c8c8c;
  --green: #4cc764;
  --red: #ff5f57;
  --blue: #5aa2ff;
  --pixel: "Jersey 10", "Courier New", monospace;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; }
.wrap {
  max-width: 1040px; margin: 0 auto; display: grid; gap: 22px;
  padding-block: 26px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--pixel); font-weight: 400; font-size: 52px; line-height: 1; margin: 0; color: #fff; letter-spacing: 0.04em; }
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
h2 { font-family: var(--pixel); font-weight: 400; font-size: 24px; margin: 0 0 10px; color: #fff; letter-spacing: 0.03em; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; align-items: start; }
.bottom { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
@media (max-width: 820px) { .top, .bottom { grid-template-columns: 1fr; } }
.box { border: 1px solid var(--line); background: var(--box); padding: 18px; min-width: 0; }
.side { display: grid; gap: 18px; }
canvas {
  display: block; width: 100%; aspect-ratio: 1; background: #fff;
  image-rendering: pixelated; touch-action: none; cursor: crosshair;
}
.hint { margin: 12px 0 0; color: var(--muted); }
button {
  font: inherit; color: var(--text); background: var(--box); border: 1px solid var(--line);
  padding: 10px 12px; width: 100%; text-align: left; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--line-on); outline-offset: 2px; }
button:disabled { opacity: 0.35; cursor: default; }
.list { display: grid; gap: 8px; }
.tool.on { border-color: var(--line-on); background: var(--box-on); color: #fff; }
.tool::before { content: "[ ] "; color: var(--muted); }
.tool.on::before { content: "[x] "; color: #fff; }
.act::before { content: "\203A  "; color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { aspect-ratio: 1; padding: 0; border: 1px solid var(--line); }
.swatch.on { outline: 2px solid var(--line-on); outline-offset: 3px; }
#log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-height: 150px; align-content: start; }
#log li::before { content: "\203A  "; color: var(--muted); }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: 0; }
.stat span { color: var(--muted); }
.stat b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { font-family: var(--mono); color: var(--green); letter-spacing: 1px; min-height: 1.4em; overflow: hidden; white-space: nowrap; }
.green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <h1>PIXEL PAINT<span class="cursor">_</span></h1>

  <div class="top">
    <section class="box">
      <canvas id="board" width="512" height="512" aria-label="Drawing canvas, 128 by 128 cells"></canvas>
      <p class="hint">128 × 128 grid. Try Bucket fill inside the boxes.</p>
    </section>

    <div class="side">
      <section class="box">
        <h2>Tool</h2>
        <div class="list">
          <button class="tool on" id="pen" data-tool="pen">Pen</button>
          <button class="tool" id="eraser" data-tool="eraser">Eraser</button>
          <button class="tool" id="fill" data-tool="fill">Bucket fill</button>
        </div>
      </section>
      <section class="box">
        <h2>Colour</h2>
        <div class="swatches" id="swatches"></div>
      </section>
      <section class="box">
        <h2>History</h2>
        <div class="list">
          <button class="act" id="undo">Undo</button>
          <button class="act" id="redo">Redo</button>
          <button class="act" id="clear">Clear</button>
        </div>
      </section>
    </div>
  </div>

  <div class="bottom">
    <section class="box">
      <h2>Log</h2>
      <ul id="log"></ul>
    </section>
    <section class="box">
      <h2>Stacks</h2>
      <div class="stat"><span>Undo stack</span><b id="undo-n">0</b></div>
      <div class="bar" id="undo-bar"></div>
      <div class="stat"><span>Redo stack</span><b id="redo-n">0</b></div>
      <div class="bar" id="redo-bar"></div>
      <div class="stat"><span>Last fill</span><b id="fill-n">-</b></div>
      <div class="stat"><span>Max DFS stack</span><b id="stack-n">-</b></div>
    </section>
  </div>
</div>

<script>
const SIZE = 128;
const CELL = 4;
const WHITE = "#ffffff";
const COLORS = ["#111111", "#ff5f57", "#f5a623", "#ffd60a", "#4cc764", "#5aa2ff", "#9b6dff", "#8b5a2b"];

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let grid = [];
let tool = "pen";
let color = COLORS[0];
let undoStack = [];
let redoStack = [];
let drawing = false;
let last = null;

function blankGrid() {
  const g = [];
  for (let r = 0; r < SIZE; r++) g.push(new Array(SIZE).fill(WHITE));
  return g;
}

function copyGrid(g) {
  return g.map(row => [...row]);
}

function paint(r, c, col) {
  grid[r][c] = col;
  ctx.fillStyle = col;
  ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
}

function drawAll() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      paint(r, c, grid[r][c]);
}

function dot(r, c) {
  const size = tool === "eraser" ? 4 : 2;
  const col = tool === "eraser" ? WHITE : color;
  for (let i = 0; i < size; i++)
    for (let j = 0; j < size; j++) {
      const rr = r + i, cc = c + j;
      if (rr < SIZE && cc < SIZE) paint(rr, cc, col);
    }
}

function lineTo(r, c) {
  const steps = Math.max(Math.abs(r - last.r), Math.abs(c - last.c), 1);
  for (let i = 1; i <= steps; i++) {
    const rr = Math.round(last.r + (r - last.r) * i / steps);
    const cc = Math.round(last.c + (c - last.c) * i / steps);
    dot(rr, cc);
  }
  last = { r, c };
}

function fill(startR, startC) {
  const target = grid[startR][startC];
  if (target === color) return null;

  const stack = [[startR, startC]];
  let count = 0;
  let maxStack = 1;
  paint(startR, startC, color);

  while (stack.length > 0) {
    const [r, c] = stack.pop();
    count++;
    const neighbours = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    for (const [nr, nc] of neighbours) {
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && grid[nr][nc] === target) {
        paint(nr, nc, color);
        stack.push([nr, nc]);
      }
    }
    maxStack = Math.max(maxStack, stack.length);
  }
  return { count, maxStack };
}

function save() {
  undoStack.push(copyGrid(grid));
  redoStack = [];
  update();
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(copyGrid(grid));
  grid = undoStack.pop();
  drawAll();
  log("Undo", "blue");
  update();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(copyGrid(grid));
  grid = redoStack.pop();
  drawAll();
  log("Redo", "blue");
  update();
}

function cellAt(e) {
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * SIZE);
  const r = Math.floor((e.clientY - rect.top) / rect.height * SIZE);
  return { r: Math.max(0, Math.min(SIZE - 1, r)), c: Math.max(0, Math.min(SIZE - 1, c)) };
}

canvas.addEventListener("pointerdown", e => {
  const { r, c } = cellAt(e);
  if (tool === "fill") {
    const before = copyGrid(grid);
    const result = fill(r, c);
    if (!result) return;
    undoStack.push(before);
    redoStack = [];
    document.getElementById("fill-n").textContent = result.count + " cells";
    document.getElementById("stack-n").textContent = result.maxStack;
    log("Fill: " + result.count + " cells, max stack " + result.maxStack, "green");
    update();
    return;
  }
  save();
  drawing = true;
  last = { r, c };
  canvas.setPointerCapture(e.pointerId);
  dot(r, c);
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;
  const { r, c } = cellAt(e);
  lineTo(r, c);
});

canvas.addEventListener("pointerup", () => {
  if (drawing) log(tool === "pen" ? "Pen stroke" : "Erased", tool === "pen" ? "" : "red");
  drawing = false;
});

function log(text, cls) {
  const list = document.getElementById("log");
  const li = document.createElement("li");
  li.textContent = text;
  if (cls) li.className = cls;
  list.prepend(li);
  if (list.children.length > 6) list.lastChild.remove();
}

function update() {
  document.getElementById("undo-n").textContent = undoStack.length;
  document.getElementById("redo-n").textContent = redoStack.length;
  document.getElementById("undo-bar").textContent = "█".repeat(Math.min(undoStack.length, 20));
  document.getElementById("redo-bar").textContent = "█".repeat(Math.min(redoStack.length, 20));
  document.getElementById("undo").disabled = undoStack.length === 0;
  document.getElementById("redo").disabled = redoStack.length === 0;
}

function selectTool(name) {
  tool = name;
  document.querySelectorAll(".tool").forEach(b => b.classList.toggle("on", b.dataset.tool === name));
}

function selectColor(col) {
  color = col;
  document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.color === col));
  if (tool === "eraser") selectTool("pen");
}

function box(r1, c1, r2, c2) {
  for (let c = c1; c <= c2; c++) { paint(r1, c, "#111111"); paint(r2, c, "#111111"); }
  for (let r = r1; r <= r2; r++) { paint(r, c1, "#111111"); paint(r, c2, "#111111"); }
}

document.querySelectorAll(".tool").forEach(b => b.addEventListener("click", () => selectTool(b.dataset.tool)));
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("redo").addEventListener("click", redo);
document.getElementById("clear").addEventListener("click", () => {
  save();
  grid = blankGrid();
  drawAll();
  log("Cleared", "red");
});

COLORS.forEach(col => {
  const b = document.createElement("button");
  b.className = "swatch" + (col === color ? " on" : "");
  b.dataset.color = col;
  b.style.background = col;
  b.setAttribute("aria-label", "Colour " + col);
  b.addEventListener("click", () => selectColor(col));
  document.getElementById("swatches").appendChild(b);
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "z") { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === "y") { e.preventDefault(); redo(); }
});

grid = blankGrid();
drawAll();
box(20, 16, 70, 60);
box(34, 74, 104, 112);
box(84, 22, 112, 54);
update();
log("Canvas ready: " + SIZE + " x " + SIZE + " grid");
</script>
</body>
</html>
